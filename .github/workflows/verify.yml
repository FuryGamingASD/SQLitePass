name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      build_id: ${{ steps.verify.outputs.build_id }}
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Build, test, audit, package and installer verification
        id: verify
        run: ./scripts/Invoke-Ci.ps1
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ github.sha }}
          path: artifacts/verification/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: SQLitePass-win-x64
          path: artifacts/releases/${{ steps.verify.outputs.build_id }}/
          if-no-files-found: error
          retention-days: 14
  release:
    needs: windows
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: SQLitePass-win-x64
          path: artifacts/release
      - name: Publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/Publish-GitHubRelease.ps1 -ArtifactDirectory artifacts/release
      - name: Verify the public update feed and package
        run: |
          dotnet restore SQLitePass.slnx --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build SQLitePass.UI.Verification -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Verifier build failed.' }
          $passed = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            $releaseVersion = (Get-Content artifacts/release/release-provenance.json -Raw | ConvertFrom-Json).Version
            dotnet run --project SQLitePass.UI.Verification -c Release --no-build --no-restore -- --verify-feed https://github.com/FuryGamingASD/SQLitePass $releaseVersion artifacts/feed-verification
            if ($LASTEXITCODE -eq 0) { $passed = $true; break }
            if ($attempt -lt 3) { Start-Sleep -Seconds 15 }
          }
          if (-not $passed) { throw 'Public update feed verification failed.' }
      - name: Preserve public feed evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-feed-verification
          path: artifacts/feed-verification/
          if-no-files-found: warn
