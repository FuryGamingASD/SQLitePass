name: Verify
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_rehearsal:
        description: Build with the public package identity and stage a release bundle
        type: boolean
        default: false
      existing_windows_installer_sha256:
        description: SHA-256 of the public same-version installer to test before replacing a release
        type: string
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
jobs:
  release-plan:
    name: Resolve source and release version
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      version: ${{ steps.plan.outputs.version }}
      package_identity: ${{ steps.plan.outputs.package_identity }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: plan
        shell: pwsh
        env:
          RELEASE_REHEARSAL: ${{ inputs.release_rehearsal }}
        run: ./scripts/Get-AvaloniaReleasePlan.ps1 -RehearseRelease:($env:RELEASE_REHEARSAL -eq 'true')
  windows:
    needs: release-plan
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PACKAGE_IDENTITY: ${{ needs.release-plan.outputs.package_identity }}
      UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-plan.outputs.commit }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Build, test and audit the shared application
        run: ./scripts/Invoke-Ci.ps1
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ github.sha }}
          path: artifacts/verification/
          if-no-files-found: error
          retention-days: 14
      - name: Build the Avalonia Windows candidate
        id: avalonia-win
        run: ./scripts/Build-AvaloniaCandidate.ps1 -Runtime win-x64 -PackageIdentity $env:PACKAGE_IDENTITY -VerifyNativeLaunch -VerifyDesktopIntegrations
      - name: Verify Windows installation and upgrades from public WPF and Avalonia releases
        if: needs.release-plan.outputs.package_identity == 'release'
        env:
          CANDIDATE_PATH: ${{ steps.avalonia-win.outputs.candidate_path }}
          EXISTING_WINDOWS_INSTALLER_SHA256: ${{ inputs.existing_windows_installer_sha256 }}
        run: |
          $validation = @{ CandidateDirectory = $env:CANDIDATE_PATH }
          if ($env:EXISTING_WINDOWS_INSTALLER_SHA256) {
              $validation.ExistingInstallerSha256 = $env:EXISTING_WINDOWS_INSTALLER_SHA256
          }
          ./scripts/Verify-AvaloniaWindowsSetup.ps1 @validation
      - name: Preserve Avalonia Windows installation evidence
        if: always() && needs.release-plan.outputs.package_identity == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-avalonia-win-x64-setup
          path: artifacts/verification/avalonia-windows-setup/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve the Avalonia Windows candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Avalonia-candidate-win-x64
          path: ${{ steps.avalonia-win.outputs.candidate_path }}/
          if-no-files-found: error
          retention-days: 14
  linux-core:
    name: Linux x64
    needs: release-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PACKAGE_IDENTITY: ${{ needs.release-plan.outputs.package_identity }}
      UPDATE_SIGNING_PUBLIC_KEY: ${{ vars.UPDATE_SIGNING_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-plan.outputs.commit }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Build, test and audit the shared application
        run: ./scripts/Invoke-Ci.ps1
      - name: Preserve Linux verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-linux-core-${{ github.sha }}
          path: artifacts/verification/
          if-no-files-found: warn
          retention-days: 14
      - name: Install AppImage build tools
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools xvfb xauth xclip dbus python3-dbus python3-gi openbox x11-utils x11-xkb-utils libx11-xcb1 libxkbcommon0 libxres1 libxtst6 libfuse2t64
      - name: Build the Avalonia Linux candidate
        id: avalonia-linux
        run: ./scripts/Build-AvaloniaCandidate.ps1 -Runtime linux-x64 -PackageIdentity $env:PACKAGE_IDENTITY -VerifyNativeLaunch -VerifyDesktopIntegrations
      - name: Verify in-place AppImage upgrade and restart
        if: needs.release-plan.outputs.package_identity == 'release'
        env:
          CANDIDATE_PATH: ${{ steps.avalonia-linux.outputs.candidate_path }}
        run: ./scripts/Verify-AvaloniaLinuxUpdate.ps1 -CandidateDirectory $env:CANDIDATE_PATH
      - name: Preserve AppImage upgrade evidence
        if: always() && needs.release-plan.outputs.package_identity == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-avalonia-linux-x64-update
          path: artifacts/verification/avalonia-linux-update/
          if-no-files-found: ignore
          retention-days: 14
      - name: Install the isolated Wayland compositor
        shell: bash
        run: sudo apt-get install -y --no-install-recommends sway xwayland wl-clipboard
      - name: Verify clipboard, tray, Auto-Type and session transport under XWayland
        env:
          CANDIDATE_PATH: ${{ steps.avalonia-linux.outputs.candidate_path }}
        run: ./scripts/Verify-AvaloniaXWayland.ps1 -CandidateDirectory $env:CANDIDATE_PATH
      - name: Preserve the Avalonia Linux candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Avalonia-candidate-linux-x64
          path: ${{ steps.avalonia-linux.outputs.candidate_path }}/
          if-no-files-found: error
          retention-days: 14
  avalonia-candidate:
    name: Assemble the shared Avalonia candidate
    needs: [release-plan, windows, linux-core]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_COMMIT: ${{ needs.release-plan.outputs.commit }}
      PACKAGE_IDENTITY: ${{ needs.release-plan.outputs.package_identity }}
      PACKAGE_VERSION: ${{ needs.release-plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-plan.outputs.commit }}
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: needs.release-plan.outputs.package_identity == 'release'
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Avalonia-candidate-win-x64
          path: artifacts/candidates/windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Avalonia-candidate-linux-x64
          path: artifacts/candidates/linux
      - name: Verify and join both package sets
        shell: pwsh
        run: ./scripts/Join-AvaloniaCandidates.ps1 -Windows artifacts/candidates/windows -Linux artifacts/candidates/linux -OutputDirectory artifacts/avalonia-candidate -Commit $env:SOURCE_COMMIT -PackageIdentity $env:PACKAGE_IDENTITY -Version $env:PACKAGE_VERSION
      - name: Generate locked Windows and Linux SBOMs
        if: needs.release-plan.outputs.package_identity == 'release'
        shell: pwsh
        env:
          RestoreLockedMode: 'true'
          EnableWindowsTargeting: 'true'
        run: |
          $toolPath = Join-Path $PWD '.tools'
          dotnet tool install CycloneDX --version 6.3.2 --tool-path $toolPath
          if ($LASTEXITCODE -ne 0) { throw 'CycloneDX installation failed.' }

          $sbomDirectory = Join-Path $PWD 'artifacts/sbom'
          New-Item -ItemType Directory -Path $sbomDirectory -Force | Out-Null
          # Restore the full graph first; CycloneDX must not force the desktop TFM onto project references.
          dotnet restore 'SQLitePass.Desktop/SQLitePass.Desktop.csproj' --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Locked restore for SBOM generation failed.' }

          $targetSets = @(
              @{ Runtime = 'win-x64'; Framework = 'net10.0-windows10.0.17763.0' },
              @{ Runtime = 'linux-x64'; Framework = 'net10.0' }
          )
          foreach ($target in $targetSets) {
              $name = "SQLitePass-$($target.Runtime).cdx.json"
              $output = Join-Path $sbomDirectory $name
              & (Join-Path $toolPath 'dotnet-CycloneDX') 'SQLitePass.Desktop/SQLitePass.Desktop.csproj' `
                  --framework $target.Framework --runtime $target.Runtime --recursive --include-project-references `
                  --output $sbomDirectory --filename $name --output-format Json `
                  --set-name "SQLitePass-$($target.Runtime)" --set-version $env:PACKAGE_VERSION --configuration Release `
                  --disable-package-restore
              if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $output -PathType Leaf)) {
                  throw "CycloneDX failed to generate the $($target.Runtime) SBOM."
              }
              $null = Get-Content -LiteralPath $output -Raw | ConvertFrom-Json
          }
      - name: Add SBOMs to the signed release bundle
        if: needs.release-plan.outputs.package_identity == 'release'
        shell: pwsh
        run: |
          $bundlePath = Join-Path $PWD 'artifacts/avalonia-candidate'
          $checksumsPath = Join-Path $bundlePath 'checksums.json'
          $checksums = @(Get-Content -LiteralPath $checksumsPath -Raw | ConvertFrom-Json)
          foreach ($runtime in @('win-x64', 'linux-x64')) {
              $name = "SQLitePass-$runtime.cdx.json"
              $source = Join-Path (Join-Path $PWD 'artifacts/sbom') $name
              $destination = Join-Path $bundlePath $name
              if (-not (Test-Path -LiteralPath $source -PathType Leaf) -or
                  @($checksums | Where-Object File -CEQ $name).Count -ne 0) {
                  throw "SBOM is missing or already listed in the release bundle: $name"
              }
              Copy-Item -LiteralPath $source -Destination $destination
              $checksums += [ordered]@{ File = $name; Hash = (Get-FileHash -LiteralPath $destination -Algorithm SHA256).Hash }
          }
          [IO.File]::WriteAllText($checksumsPath, ($checksums | ConvertTo-Json -Depth 4), [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Avalonia-${{ needs.release-plan.outputs.package_identity }}-win-x64-linux-x64
          path: artifacts/avalonia-candidate/
          if-no-files-found: error
          retention-days: 7

  attest-release:
    name: Attest release artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.release-plan.outputs.package_identity == 'release'
    needs: [release-plan, avalonia-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Avalonia-release-win-x64-linux-x64
          path: artifacts/avalonia-candidate
      - name: Resolve release files for platform SBOM attestations
        id: subjects
        shell: pwsh
        run: |
          $bundlePath = Join-Path $PWD 'artifacts/avalonia-candidate'
          $provenance = Get-Content -LiteralPath (Join-Path $bundlePath 'release-provenance.json') -Raw | ConvertFrom-Json
          $resolved = @{}
          foreach ($runtime in @('win-x64', 'linux-x64')) {
              $platform = @($provenance.Platforms | Where-Object Runtime -CEQ $runtime)
              if ($platform.Count -ne 1) { throw "Release provenance must contain exactly one $runtime platform." }
              $names = @($platform[0].Distribution, $platform[0].UpdatePackage)
              if ($names.Count -ne 2 -or @($names | Where-Object { $_ -notmatch '^[a-zA-Z0-9][a-zA-Z0-9._-]+$' }).Count -ne 0) {
                  throw "Release provenance contains an invalid $runtime asset name."
              }
              $paths = @($names | ForEach-Object {
                  $path = Join-Path $bundlePath $_
                  if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Release asset is missing: $_" }
                  "artifacts/avalonia-candidate/$_"
              })
              $resolved[$runtime] = $paths
          }
          $allPaths = @($resolved['win-x64']) + @($resolved['linux-x64'])
          if ($allPaths.Count -ne 4 -or @($allPaths | Select-Object -Unique).Count -ne 4) {
              throw 'Expected four unique distribution and updater package subjects.'
          }
          $delimiter = "SUBJECTS_$([Guid]::NewGuid().ToString('N'))"
          $outputLines = @(
              "all_subjects<<$delimiter", ($allPaths -join "`n"), $delimiter,
              "windows_subjects<<$delimiter", ($resolved['win-x64'] -join "`n"), $delimiter,
              "linux_subjects<<$delimiter", ($resolved['linux-x64'] -join "`n"), $delimiter
          )
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, ($outputLines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
      - name: Create SLSA provenance for release packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.subjects.outputs.all_subjects }}
      - name: Attest the Windows SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.subjects.outputs.windows_subjects }}
          sbom-path: artifacts/avalonia-candidate/SQLitePass-win-x64.cdx.json
      - name: Attest the Linux SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.subjects.outputs.linux_subjects }}
          sbom-path: artifacts/avalonia-candidate/SQLitePass-linux-x64.cdx.json
